name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'alembic/**'
      - 'templates/**'
      - 'static/**'
      - 'pyproject.toml'
      - 'Dockerfile'
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'rust/v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    # Python image: main pushes and v* tags only (not rust/v* tags)
    if: ${{ !startsWith(github.ref, 'refs/tags/rust/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # main branch → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 → :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # every build → :sha-abc1234 (for traceability)
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rust-image:
    # Rust image: ghcr.io/isqanderm/memex:rust-<version> and :rust-latest on rust/v* tags
    if: ${{ startsWith(github.ref, 'refs/tags/rust/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#rust/v}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=rust-${{ steps.version.outputs.version }}
            type=raw,value=rust-latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,mode=max,scope=rust
