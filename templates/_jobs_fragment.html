<div id="jobs-section"
     {% if active_jobs %}
     hx-get="/jobs-fragment"
     hx-trigger="every 3s"
     hx-swap="outerHTML"
     {% endif %}>
  {% if active_jobs %}
  <div class="section-label">Processing · {{ active_jobs | length }}</div>
  {% for job in active_jobs %}
  <div class="processing-banner">
    <div class="spinner"></div>
    <div>
      <div class="processing-name">{{ (job.source or '').split('/')[-1] or job.source }}</div>
      <div class="processing-status">
        {% if job.status == 'error' %}
          <span style="color:#f87171">Error: {{ job.error or 'unknown' }}</span>
        {% else %}
          {{ job.status }}
        {% endif %}
      </div>
    </div>
  </div>
  {% endfor %}
  {% endif %}
</div>
