<div class="exchange">
  <div class="user-bubble-wrap">
    <div class="user-bubble">{{ query }}</div>
  </div>
  <div class="bot-bubble-wrap">
    <div class="bot-avatar">⬡</div>
    <div class="bot-bubble">
      {{ answer }}
      {% if sources %}
      <div class="source-tags">
        {% for s in sources %}
        <span class="source-tag">
          📄 {% if s.title %}{{ s.title }}{% elif s.section %}{{ s.section }}{% else %}источник {{ s.index }}{% endif %}{% if s.page %} · стр. {{ s.page }}{% endif %}
        </span>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</div>
