<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memex — {% block title %}{% endblock %}</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #222; }
        nav { margin-bottom: 24px; }
        nav a { margin-right: 16px; text-decoration: none; color: #0066cc; }
        nav a:hover { text-decoration: underline; }
        input[type=text], input[type=file] { padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; font-size: 1em; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        .answer { background: #f6f8fa; border-left: 4px solid #0066cc; padding: 16px; margin-top: 16px; white-space: pre-wrap; }
        .sources { margin-top: 12px; font-size: 0.88em; color: #555; }
        .source-item { margin-bottom: 4px; }
        .error { color: #cc0000; }
        .status { color: #888; font-size: 0.82em; }
        ul { padding-left: 20px; }
        li { margin-bottom: 6px; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
    </style>
</head>
<body>
    <nav>
        <strong>Memex</strong>
        <a href="/">Поиск</a>
        <a href="/documents">Документы</a>
        <a href="/upload">Загрузить</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
