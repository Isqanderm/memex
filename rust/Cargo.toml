[package]
name = "memex"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "memex"
path = "src/main.rs"

[dependencies]
# HTTP сервер
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# База данных
rusqlite = { version = "0.39", features = ["bundled", "load_extension"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
sqlite-vec = "0.1"

# Полнотекстовый поиск
tantivy = "0.26"

# Эмбеддинги и ранжировщик
fastembed = "5"

# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP клиент (для LLM API)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Типы ошибок
thiserror = "2"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Дата/время
chrono = { version = "0.4", features = ["serde"] }

# SHA256 для чексумм
sha2 = "0.10"
hex = "0.4"

# Шаблоны
minijinja = { version = "2", features = ["loader"] }

# Парсинг документов
pulldown-cmark = "0.13"
calamine = { version = "0.35", features = ["dates"] }
zip = "0.6"
quick-xml = "0.40"

# Определение языка
whichlang = "0.1"

# Конфиг
dotenvy = "0.15"

# Логирование
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streaming
tokio-stream = "0.1"
futures = "0.3"
bytes = "1"

# MIME
mime_guess = "2"

# Async trait
async-trait = "0.1"

# Async stream macros
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
