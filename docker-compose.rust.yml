# docker-compose.rust.yml — Memex without PostgreSQL
# Single binary + SQLite + ONNX models
#
# Quick start:
#   cp rust/.env.example .env
#   # Edit .env with your API keys
#   docker compose -f docker-compose.rust.yml up
#
# First run: downloads ONNX embedding (~90MB) and reranker (~100MB) models
#
# Resource estimates (Raspberry Pi 4, 4GB RAM):
#   Idle RAM:        ~80-120 MB (app + SQLite)
#   Under load:      ~400-800 MB (during embedding inference)
#   ONNX model size: ~200 MB total (cached to disk)
#   Binary size:     ~25 MB (stripped)
#   Docker image:    ~150 MB
#
# vs Python version:
#   Idle RAM:        ~2.5 GB (PyTorch + FastAPI + PostgreSQL)
#   Cold start:      ~15 seconds
#   Rust cold start: ~2-3 seconds (model loading)

services:
  memex:
    build:
      context: .
      dockerfile: rust/Dockerfile
    # OR use pre-built image:
    # image: ghcr.io/your-org/memex-rust:latest
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Persistent data: SQLite DB, tantivy FTS index, uploaded files
      - ./data:/app/data
      # ONNX model cache (reused between restarts, ~200MB)
      - fastembed_models:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s  # Models load on first start

volumes:
  fastembed_models:
