# docker-compose.rust.yml — Memex without PostgreSQL
# Single binary + SQLite + ONNX models
#
# Quick start:
#   cp rust/.env.example .env
#   # Edit .env with your API keys
#   docker compose -f docker-compose.rust.yml up
#
# ONNX models (e5-small + jina reranker v2, ~1.2 GB) are baked into the image
# at /app/models, so the container starts without network access.
#
# Sizes: image ~1.8 GB. First start loads the models in ~20-30 s.

services:
  memex:
    build:
      context: .
      dockerfile: rust/Dockerfile
      # To build for Raspberry Pi 4 (ARM64):
      #   docker buildx build --platform=linux/arm64 -f rust/Dockerfile -t memex-rust:arm64 .
      args:
        TARGETARCH: amd64  # Change to arm64 for Raspberry Pi
    # OR use pre-built image:
    # image: ghcr.io/your-org/memex-rust:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Baked-in model cache; wins over MODEL_CACHE_DIR in .env.
      MODEL_CACHE_DIR: /app/models
    volumes:
      # Persistent data: SQLite DB (+WAL), tantivy FTS index, uploaded files.
      # Models live in /app/models, outside this mount.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s  # Models load on start (~20-30 s)
